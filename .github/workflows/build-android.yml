name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (pobranie kodu)
      uses: actions/checkout@v4

    - name: Set up JDK 17 (konfiguracja środowiska Java)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew (nadanie uprawnień)
      run: chmod +x gradlew

    - name: Build Debug APK (budowanie aplikacji)
      run: ./gradlew assembleDebug

    - name: Upload APK artifact (zapisanie pliku APK jako gotowego do pobrania)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-release
        path: app/build/outputs/apk/debug/app-debug.apk
